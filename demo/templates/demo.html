<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HybridMatt — Real-Time Video Matting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid #1a1a2e;
      background: linear-gradient(180deg, #0f0f1a 0%, #0a0a0f 100%);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    header h1 span {
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.85rem;
      color: #6b6b80;
      margin-top: 0.3rem;
    }

    .stats-bar {
      display: flex;
      gap: 2rem;
      justify-content: center;
      padding: 0.8rem 1rem;
      font-size: 0.8rem;
      color: #8888a0;
      border-bottom: 1px solid #1a1a2e;
      width: 100%;
      background: #0c0c14;
    }

    .stats-bar .stat {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .stats-bar .value {
      color: #a78bfa;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      gap: 1rem;
      width: 100%;
      max-width: 960px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      width: 100%;
    }

    .panel {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #111118;
      border: 1px solid #1e1e30;
      aspect-ratio: 4 / 3;
    }

    .panel.composite {
      grid-column: 1 / -1;
      max-width: 50%;
      justify-self: center;
    }

    .panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .panel .label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.4rem 0.75rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: #ccc;
    }

    footer {
      padding: 1rem;
      font-size: 0.7rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1><span>HybridMatt</span> &mdash; Real-Time Video Matting</h1>
    <p>ConvGRU + Spatial Attention &middot; MobileNetV3 Backbone</p>
  </header>

  <div class="stats-bar">
    <div class="stat"><div class="dot"></div> <span>Live</span></div>
    <div class="stat">FPS <span class="value" id="fpsVal">&mdash;</span></div>
  </div>

  <main>
    <div class="grid">
      <div class="panel">
        <img src="/stream/input" alt="Input" />
        <div class="label">Input</div>
      </div>
      <div class="panel">
        <img src="/stream/alpha" alt="Alpha Matte" />
        <div class="label">Alpha Matte</div>
      </div>
      <div class="panel composite">
        <img src="/stream/composite" alt="Composite" />
        <div class="label">Composite</div>
      </div>
    </div>
  </main>

  <footer>HybridMatt &mdash; SNU Semester 6 IVP Project</footer>

  <script>
    async function updateFps() {
      try {
        const res = await fetch('/stats');
        const data = await res.json();
        document.getElementById('fpsVal').textContent = data.fps;
      } catch (e) {}
    }
    setInterval(updateFps, 500);
  </script>
</body>
</html>
